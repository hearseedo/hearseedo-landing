name: Deploy landing
on:
  pull_request:          # draft (preview) deploy only
  push:
    branches: [main]     # production, but only after the 'production' environment is approved
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false
env:
  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
  NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
  NETLIFY_CLI: netlify-cli@27.16.2
jobs:
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 20 }
      - run: npm test && npm run build
      - run: npx --yes $NETLIFY_CLI deploy --dir _site --functions netlify/functions --alias pr-${{ github.event.number }}
  production:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production        # configure required reviewers = owner in GitHub > Settings > Environments
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 20 }
      - run: npm test && npm run build
      - run: npx --yes $NETLIFY_CLI deploy --prod --dir _site --functions netlify/functions
      - name: Smoke test production
        run: |
          sleep 10
          curl -fsSI https://hsdos.ai/ | tee /tmp/h.txt
          grep -qi '^content-security-policy:' /tmp/h.txt
          grep -qi '^x-frame-options: DENY' /tmp/h.txt
          test "$(curl -s -o /dev/null -w '%{http_code}' https://hsdos.ai/index-old.html)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST https://hsdos.ai/.netlify/functions/founding-interest -H 'Content-Type: application/json' -d '{\"name\":\"ci\",\"email\":\"bad\"}')" = "400"
